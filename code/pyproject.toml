[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bili-ai-fasttext"
version = "0.1.0"
description = "Offline Chinese comment and nickname style classifier"
requires-python = ">=3.11"
dependencies = ["fasttext-wheel==0.9.2", "jieba==0.42.1", "numpy==1.26.4"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
bili-ai = "bili_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bili_ai = ["assets/*"]

[tool.setuptools.data-files]
"share/bili-ai/deploy" = ["deploy/*.mjs", "deploy/verify.html"]
"share/bili-ai/deploy/vendor" = ["deploy/vendor/fasttext.mjs", "deploy/vendor/fasttext.wasm", "deploy/vendor/LICENSE", "deploy/vendor/provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-temp"
